name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          if [ -n "$RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "v$version"
            test -f "docs/releases/$RELEASE_TAG.md"
          fi
      - name: Native and artwork fixtures
        run: Scripts/test.sh
      - name: Build app
        run: Scripts/build-app.sh
      - name: Browser fixtures
        run: Scripts/check-browser.sh
      - name: Package prerelease
        run: Scripts/package-prerelease.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prerelease
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prerelease
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published artifacts.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "OpenAudio $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
